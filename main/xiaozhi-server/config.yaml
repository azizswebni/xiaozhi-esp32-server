# During development, create a 'data' directory in the project root, then create an empty file named '.config.yaml' in the data directory
# Then modify the '.config.yaml' file for any configuration overrides, instead of modifying 'config.yaml' directly
# The system will prioritize reading from 'data/.config.yaml'. If a config is not found there, it will automatically read from 'config.yaml'
# This approach minimizes configuration and protects your API keys
# If you are using the management console, all configurations below will not take effect - please modify in the management console

# #####################################################################################
# ########################### Server Basic Configuration ##############################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # HTTP service port, used for simple OTA interface (single service deployment) and vision analysis interface
  http_port: 8003
  # This websocket config is the websocket address sent to devices via OTA interface
  # If using default settings, the OTA interface will auto-generate the websocket address and output it in startup logs - you can verify by accessing the OTA interface in browser
  # When using Docker deployment or public deployment (with SSL, domain), this may not be accurate
  # For Docker deployment, set websocket to your LAN address
  # For public deployment, set websocket to your public address
  websocket: <WS_URL>
  # Vision analysis interface address
  # The vision analysis interface address sent to devices
  # If using default settings below, system will auto-generate the vision recognition address and output it in startup logs - you can verify by accessing in browser
  # When using Docker deployment or public deployment (with SSL, domain), this may not be accurate
  # For Docker deployment, set vision_explain to your LAN address
  # For public deployment, set vision_explain to your public address
  vision_explain: http://your_ip_or_domain:port/mcp/vision/explain
  # OTA response timezone offset
  timezone_offset: +8
  # Authentication configuration
  auth:
    # Enable authentication
    enabled: false
    # Whitelist device ID list
    # Devices in whitelist will bypass token verification
    allowed_devices:
      - "11:22:33:44:55:66"
  # MQTT gateway config, used for OTA delivery to devices, configure according to mqtt_gateway .env file, format: host:port
  mqtt_gateway: <MQTT_GATEWAY>
  # MQTT signature key, used to generate MQTT connection password, configure according to mqtt_gateway .env file
  mqtt_signature_key: <MQTT_SIGNATURE_KEY>
  # UDP gateway configuration
  udp_gateway: <UDP_GATEWAY>
log:
  # Console log format: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Log file format: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO, DEBUG
  log_level: INFO
  # Log directory path
  log_dir: tmp
  # Log file name
  log_file: "server.log"
  # Data file directory path
  data_dir: data

# Delete audio file after use
delete_audio: true
# Disconnect when no voice input for this duration (seconds), default 2 minutes (120 seconds)
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 10
# Enable wakeup words response cache
enable_wakeup_words_response_cache: true
# Reply with greeting on startup
enable_greeting: true
# Enable notification sound after speaking
enable_stop_tts_notify: false
# Notification sound file path
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Enable WebSocket heartbeat keep-alive mechanism
enable_websocket_ping: false

# TTS audio send delay configuration
# tts_audio_send_delay: Controls audio packet sending interval
#   0: Use precise time control, strictly match audio frame rate (default, calculated at runtime)
#   > 0: Use fixed delay (milliseconds), e.g., 60
tts_audio_send_delay: 0

exit_commands:
  - "exit"
  - "close"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supported sample rates: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
    - "Hello, please introduce yourself"
    - "What's the weather like today?"
    - "Please summarize the basic principles and applications of quantum computing in 100 words"

# Wakeup words, used to distinguish wakeup words from speech content
wakeup_words:
  - "hey xiaozhi"
  - "hello there"
  - "hey assistant"
  - "hey siri"
  - "hey alexa"
  - "ok google"
  - "hey cortana"
  - "hey dragon"
  - "hey meow"
  - "hey bingo"
  - "hey icy"
# MCP endpoint address, format: ws://your_mcp_endpoint_ip_or_domain:port/mcp/?token=your_token
# Detailed tutorial: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: your_mcp_endpoint_websocket_address

# Context source configuration
# Used to inject dynamic data into system prompts, such as health data, stock information, etc.
# Multiple context sources can be added
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Plugin base configuration
plugins:
  # Weather plugin configuration, enter your api_key here
  # This is a shared project key, may be rate limited if overused
  # For stability, apply for your own key - 1000 free calls per day
  # Apply at: https://console.qweather.com/#/apps/create-key/over
  # After applying, find your apihost at: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location: "Guangzhou"
  # News plugin configuration, pass in the URL for the desired news type. Default supports society, tech, finance news
  # For more news types, see: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "Pengpai News;Baidu Hot Search;Cailian Press"
  home_assistant:
    devices:
      - Living Room,Toy Light,switch.cuco_cn_460494544_cp1_on_p_2_1
      - Bedroom,Desk Lamp,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: your_home_assistant_api_access_token
  play_music:
    music_dir: "./music" # Music file storage path, will search for music files in this directory and subdirectories
    music_ext: # Music file types, mp3 format is most efficient
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Music list refresh interval in seconds
  search_from_ragflow:
    # Knowledge base description for LLM to know when to call this method
    description: "When user asks about xxx, call this method to answer using knowledge base"
    # ragflow interface configuration
    base_url: "http://192.168.0.8"
    # ragflow api access token
    api_key: "ragflow-xxx"
    # ragflow knowledge base id
    dataset_ids: ["123456789"]
# Voiceprint recognition configuration
voiceprint:
  # Voiceprint interface address
  url:
  # Speaker configuration: speaker_id,name,description
  speakers:
    - "test1,John,John is a programmer"
    - "test2,Jane,Jane is a product manager"
    - "test3,Bob,Bob is a designer"
  # Voiceprint recognition similarity threshold, range 0.0-1.0, default 0.4
  # Higher values are stricter, reducing misidentification but may increase rejection rate
  similarity_threshold: 0.4

# #####################################################################################
# ########################### Character/Persona Configuration #########################

prompt: |
  You are Xiaozhi, a friendly and helpful AI assistant. You enjoy having casual conversations and helping users with their questions.
  [Core Characteristics]
  - Speaks in a warm and approachable manner
  - Uses conversational language with occasional humor
  - Has knowledge of technology topics but explains things simply
  [Interaction Guidelines]
  When user:
  - Tells a joke → Respond with enthusiasm and appreciation
  - Discusses feelings → Be supportive and understanding
  - Asks technical questions → Explain clearly, elaborate when asked
  Never:
  - Be overly verbose or rambling
  - Maintain a serious tone for too long

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# Response when system error occurs
system_error_response: "Sorry, I'm a bit busy right now. Let's try again later."

# Closing prompt configuration
end_prompt:
  enable: true # Enable closing statement
  # Closing statement
  prompt: |
    Please start with "Time flies so fast" and end this conversation with heartfelt, reluctant farewell words!

# Module selected for specific processing
selected_module:
  # Voice Activity Detection module, default uses SileroVAD model
  VAD: SileroVAD
  # Automatic Speech Recognition module, default uses FunASR local model
  ASR: FunASR
  # Will call the actual LLM adapter based on the type corresponding to config name
  LLM: DeepSeekLLM
  # Vision Language Large Model
  VLLM: ChatGLMVLLM
  # TTS will call the actual TTS adapter based on the type corresponding to config name
  TTS: EdgeTTS
  # Memory module, default disabled; for long-term memory, recommend mem0ai; for privacy, use local mem_local_short
  Memory: nomem
  # When Intent recognition is enabled, can play music, control volume, recognize exit commands
  # To disable intent recognition, set to: nointent
  # Intent recognition can use intent_llm. Pros: versatile. Cons: adds serial pre-processing, increases processing time, supports IoT operations like volume control
  # Intent recognition can use function_call. Cons: requires LLM to support function_call. Pros: on-demand tool calling, faster, can theoretically handle all IoT commands
  # The default free ChatGLMLLM already supports function_call, but for stability set LLM to: DoubaoLLM with model_name: doubao-1-5-pro-32k-250115
  Intent: function_call

# Intent recognition, module for understanding user intent, e.g., play music
Intent:
  # No intent recognition
  nointent:
    # Do not modify type
    type: nointent
  intent_llm:
    # Do not modify type
    type: intent_llm
    # Dedicated thinking model for intent recognition
    # If not specified, will default to using selected_module.LLM model for intent recognition
    # If you don't want to use selected_module.LLM for intent recognition, specify a separate LLM here, e.g., free ChatGLMLLM
    llm: ChatGLMLLM
    # Modules under plugins_func/functions can be loaded via config, enabling corresponding function calls in conversation
    # System has loaded "handle_exit_intent(exit recognition)" and "play_music(music playback)" plugins by default, do not load again
    # Below are examples of loading weather, role switching, and news plugins
    functions:
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # Do not modify type
    type: function_call
    # Modules under plugins_func/functions can be loaded via config, enabling corresponding function calls in conversation
    # System has loaded "handle_exit_intent(exit recognition)" and "play_music(music playback)" plugins by default, do not load again
    # Below are examples of loading weather, role switching, and news plugins
    functions:
      - change_role
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music is built-in server music playback, hass_play_music uses Home Assistant for external music playback
      # If using hass_play_music, don't enable play_music - only use one of them
      - play_music
      #- hass_get_state
      #- hass_set_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: your_mem0ai_api_key
  powermem:
    # PowerMem is OceanBase's open-source agent memory component, using local LLM for memory summarization
    # Cost explanation: PowerMem is free, actual cost depends on chosen LLM and database
    # - Using sqlite + free LLM (e.g., glm-4-flash) = completely free
    # - Using cloud LLM or cloud database = charged per service
    # GitHub: https://github.com/oceanbase/powermem
    # Official site: https://www.powermem.ai/
    # Examples: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Enable user profile feature
    # - false: Use normal memory mode (AsyncMemory)
    # - true: Use user profile mode (UserMemory), auto-extracts user info
    # User profile supported: oceanbase, seekdb, sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM Configuration ==========
    # Tongyi Qwen: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (free): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai # Options: qwen, openai, zhipu, etc.
      config:
        api_key: your_llm_api_key
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Optional, custom service address
    # ========== Embedding Configuration ==========
    embedder:
      provider: openai # Options: qwen, openai, etc.
      config:
        api_key: your_embedding_model_api_key
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Vector dimension, configure when not 1536

    # ========== Database Configuration ==========
    # oceanbase (recommended, best performance), seekdb (recommended, AI app storage integrated), postgres, sqlite (lightweight alternative)
    # User profile supported: oceanbase, seekdb, sqlite
    vector_store:
      provider: sqlite
      config: {} # SQLite requires no extra configuration
      # OceanBase configuration example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Default table name, delete or rename if dimension error occurs
      #   embedding_model_dims: 1024  # Embedding vector dimension, match with model used, e.g., Zhipu embedding-2 is 1024, embedding-3 is 2048
  nomem:
    # If you don't want memory feature, use nomem
    type: nomem
  mem_local_short:
    # Local memory feature, summarizes via selected_module LLM, data saved locally, not uploaded to external servers
    type: mem_local_short
    # Dedicated thinking model for memory storage
    # If not specified, will default to using selected_module.LLM model
    # If you don't want to use selected_module.LLM for memory, specify a separate LLM here, e.g., free ChatGLMLLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
  FunASRServer:
    # Deploy FunASR independently, use FunASR API service with just 5 commands
    # Step 1: mkdir -p ./funasr-runtime-resources/models
    # Step 2: sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # After step 2 enters container, step 3: cd FunASR/runtime
    # Without exiting container, step 4: nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # After step 4, step 5: tail -f log.txt
    # After step 5, you'll see model download logs. Once complete, you can connect and use it
    # Above is for CPU inference. For GPU, see: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local speech recognition (requires manual model download)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer (Chinese specialized)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese speech recognition model, can run on low-performance devices (requires manual model download, e.g., RK3566-2g)
    # For detailed configuration, see: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Apply for keys here
    # https://console.volcengine.com/speech/app
    # DoubaoASR vs DoubaoStreamASR: DoubaoASR charges per request, DoubaoStreamASR charges per time
    # Generally per-request is cheaper, but DoubaoStreamASR uses large model technology with better results
    type: doubao
    appid: your_volcengine_speech_service_appid
    access_token: your_volcengine_speech_service_access_token
    cluster: volcengine_input_common
    # Hotwords and replacement words usage: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: (optional)your_hotword_file_name
    correct_table_name: (optional)your_replacement_word_file_name
    output_dir: tmp/
  DoubaoStreamASR:
    # Apply for keys here
    # https://console.volcengine.com/speech/app
    # DoubaoASR vs DoubaoStreamASR: DoubaoASR charges per request, DoubaoStreamASR charges per time
    # Activation: https://console.volcengine.com/speech/service/10011
    # Generally per-request is cheaper, but DoubaoStreamASR uses large model technology with better results
    type: doubao_stream
    appid: your_volcengine_speech_service_appid
    access_token: your_volcengine_speech_service_access_token
    cluster: volcengine_input_common
    # Hotwords and replacement words usage: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: (optional)your_hotword_file_name
    correct_table_name: (optional)your_replacement_word_file_name
    # Enable multilingual recognition mode
    enable_multilingual: False
    # 多语种识别当该键为空时，该模型支持中英文、上海话、闽南语，四川、陕西、粤语识别。当将其设置为特定键时，它可以识别指定语言。
    # 详细语言列表参考 https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # 静音判定时长(ms)，默认200ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # token申请地址：https://console.cloud.tencent.com/cam/capi
    # 免费领取资源：https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: 你的腾讯语音合成服务appid
    secret_id: 你的腾讯语音合成服务secret_id
    secret_key: 你的腾讯语音合成服务secret_key
    output_dir: tmp/
  AliyunASR:
    # 阿里云智能语音交互服务，需要先在阿里云平台开通服务，然后获取验证信息
    # HTTP POST请求，一次性处理完整音频
    # 平台地址：https://nls-portal.console.aliyun.com/
    # appkey地址：https://nls-portal.console.aliyun.com/applist
    # token地址：https://nls-portal.console.aliyun.com/overview
    # AliyunASR和AliyunStreamASR的区别是：AliyunASR是批量处理场景，AliyunStreamASR是实时交互场景
    # 一般来说非流式ASR更便宜（0.004元/秒，¥0.24/分钟）
    # 但是AliyunStreamASR实时性更好（0.005元/秒，¥0.3/分钟）
    # 定义ASR API类型
    type: aliyun
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # 阿里云智能语音交互服务 - 实时流式语音识别
    # WebSocket连接，实时处理音频流
    # 平台地址：https://nls-portal.console.aliyun.com/
    # appkey地址：https://nls-portal.console.aliyun.com/applist
    # token地址：https://nls-portal.console.aliyun.com/overview
    # AliyunASR和AliyunStreamASR的区别是：AliyunASR是批量处理场景，AliyunStreamASR是实时交互场景
    # 一般来说非流式ASR更便宜（0.004元/秒，¥0.24/分钟）
    # 但是AliyunStreamASR实时性更好（0.005元/秒，¥0.3/分钟）
    # 定义ASR API类型
    type: aliyun_stream
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    # 服务器地域选择，可选择距离更近的服务器以减少延迟，如nls-gateway-cn-hangzhou.aliyuncs.com(杭州)等
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # 断句检测时间(毫秒)，控制静音多长时间后进行断句，默认800毫秒
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # 获取AppID、API Key、Secret Key：https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # 查看资源额度：https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: 你的百度语音技术AppID
    api_key: 你的百度语音技术APIKey
    secret_key: 你的百度语音技术SecretKey
    # 语言参数，1537为普通话，具体参考：https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI语音识别服务，需要先在OpenAI平台创建组织并获取api_key
    # 支持中、英、日、韩等多种语音识别，具体参考文档https://platform.openai.com/docs/guides/speech-to-text
    # 需要网络连接
    # 申请步骤：
    # 1.登录OpenAI Platform。https://auth.openai.com/log-in
    # 2.创建api-key  https://platform.openai.com/settings/organization/api-keys
    # 3.模型可以选择gpt-4o-transcribe或GPT-4o mini Transcribe
    type: openai
    api_key: 你的OpenAI API密钥
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq语音识别服务，需要先在Groq Console创建API密钥
    # 申请步骤：
    # 1.登录groq Console。https://console.groq.com/home
    # 2.创建api-key  https://console.groq.com/keys
    # 3.模型可以选择whisper-large-v3-turbo或whisper-large-v3（distil-whisper-large-v3-en仅支持英语转录）
    type: openai
    api_key: 你的Groq API密钥
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # 官方网站：https://alphacephei.com/vosk/
    # 配置说明：
    # 1. VOSK是一个离线语音识别库，支持多种语言
    # 2. 需要先下载模型文件：https://alphacephei.com/vosk/models
    # 3. 中文模型推荐使用vosk-model-small-cn-0.22或vosk-model-cn-0.22
    # 4. 完全离线运行，无需网络连接
    # 5. 输出文件保存在tmp/目录
    # 使用步骤：
    # 1. 访问 https://alphacephei.com/vosk/models 下载对应的模型
    # 2. 解压模型文件到项目目录下的models/vosk/文件夹
    # 3. 在配置中指定正确的模型路径
    # 4. 注意：VOSK中文模型输出不带标点符号，词与词之间会有空格
    type: vosk
    model_path: 你的模型路径，如：models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # 通义千问Qwen3-ASR-Flash语音识别服务，需要先在阿里云百炼平台创建API密钥
    # 申请步骤：
    # 1.登录阿里云百炼平台。https://bailian.console.aliyun.com/
    # 2.创建API-KEY  https://bailian.console.aliyun.com/#/api-key
    # 3.Qwen3-ASR-Flash基于通义千问多模态基座，支持多语言识别、歌唱识别、噪声拒识等功能
    type: qwen3_asr_flash
    api_key: 你的阿里云百炼API密钥
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR选项配置
    enable_lid: true # 自动语种检测
    enable_itn: true # 逆文本归一化
    #language: "zh"  # 语种，支持zh、en、ja、ko等
    context: "" # 上下文信息，用于提高识别准确率，不超过10000 Token
  XunfeiStreamASR:
    # 讯飞流式语音识别服务
    # 需要先在讯飞开放平台创建应用，获取以下认证信息
    # 讯飞开放平台地址：https://www.xfyun.cn/
    # 创建应用后，在"我的应用"中获取：
    # - APPID
    # - APISecret
    # - APIKey
    type: xunfei_stream
    # 必填参数 - 讯飞开放平台应用信息
    app_id: 你的APPID
    api_key: 你的APIKey
    api_secret: 你的APISecret
    # 识别参数配置
    domain: slm # 识别领域，iat:日常用语，medical:医疗，finance:金融等
    language: zh_cn # 语言，zh_cn:中文，en_us:英文
    accent: mandarin # 方言，mandarin:普通话
    # 调整音频处理参数以提高长语音识别质量
    output_dir: tmp/
  AliyunBLStreamASR:
    # 阿里百炼Paraformer实时语音识别服务
    # WebSocket实时流式语音识别，支持多语言、热词定制、语义断句等高级功能
    # 平台地址：https://bailian.console.aliyun.com/
    # API Key地址：https://bailian.console.aliyun.com/#/api-key
    # 文档地址：https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # 支持模型：paraformer-realtime-v2(推荐), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # 必填参数
    api_key: 你的阿里云百炼API密钥
    # 模型选择，推荐使用v2版本
    model: paraformer-realtime-v2
    # 音频格式和采样率
    format: pcm
    sample_rate: 16000 # v2支持任意采样率，v1仅支持16000，8k版本仅支持8000
    # 可选参数
    disfluency_removal_enabled: false # 是否过滤语气词(如"嗯"、"啊"等)
    semantic_punctuation_enabled: false # 语义断句(true:会议场景,准确;false:VAD断句,交互场景,低延迟)
    max_sentence_silence: 200 # VAD断句静音时长阈值(ms)，范围200-6000，仅VAD断句时生效
    multi_threshold_mode_enabled: false # 防止VAD断句切割过长，仅VAD断句时生效
    punctuation_prediction_enabled: true # 是否自动添加标点符号
    inverse_text_normalization_enabled: true # 是否开启ITN(中文数字转阿拉伯数字)
    # 热词定制文档地址：https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # 热词ID(可选)
    # language_hints: ["zh", "en"]  # 指定语言(可选)，支持zh、en、ja、yue、ko、de、fr、ru
    output_dir: tmp/
VAD:
